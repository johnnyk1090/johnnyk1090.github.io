name: site

# Builds the site and its /work/ section (every project's README and full source, readable in
# place) and publishes it. Runs on every push, by hand, and daily so the code pages follow the
# project repositories without anyone acting.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the run keep its own daily schedule enabled (keep-schedule job)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install the renderer
        run: python -m pip install -r tools/requirements.txt
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html film.mp4 film-m.mp4 film-still.jpg _site/
          python -W error tools/build_work.py _site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check every page and link target exists
        run: |
          python - <<'EOF'
          import pathlib, re, sys, urllib.parse
          site = pathlib.Path("_site"); bad = []
          pages = list(site.rglob("*.html"))
          for p in pages:
              for url in re.findall(r'(?:href|src)="(/[^"#]*)', p.read_text(encoding="utf-8")):
                  t = site / urllib.parse.unquote(url).lstrip("/")
                  if not (t.is_file() or (t / "index.html").is_file()):
                      bad.append(f"{p.relative_to(site)} -> {url}")
          projects = [d for d in (site / "work").iterdir() if d.is_dir()]
          print(f"{len(pages)} pages, {len(projects)} projects, {len(bad)} missing targets")
          if bad or not projects:
              print("\n".join(bad)); sys.exit(1)
          EOF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  keep-schedule:
    # GitHub turns a scheduled workflow off after 60 days without repository activity; enabling
    # it again while it is still enabled resets that clock. Kept apart so it never blocks a deploy.
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow enable site.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
